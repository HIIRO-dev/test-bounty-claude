name: Claude
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          model: claude-sonnet-4-5
          show_full_output: "true"
          prompt: |
            Analyze this issue and post a comment summarizing what the reporter is asking.
            Start your comment with "Hello! I've analyzed this issue:"